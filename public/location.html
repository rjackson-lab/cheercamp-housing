<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location · UCA Camp Housing</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="vs-ops-body">

<header class="vs-ops-header">
  <a class="vs-lockup" href="/">
    <span class="vs-wordmark">UCA</span>
    <span class="vs-divider"></span>
    <span class="vs-product">Location Management</span>
  </a>
  <div style="margin-left:auto;">
    <a href="/" style="color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; margin-right: 16px;">← Back to dashboard</a>
  </div>
  <div id="vs-profile-mount"></div>
</header>

<main class="vs-page">
  <div id="header-block"></div>

  <div class="vs-panel">
    <div class="vs-panel-header">
      <span>Venue Templates &amp; Files</span>
    </div>
    <div class="vs-panel-body">
      <div class="vs-card-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
        <div class="vs-card">
          <div class="vs-label">Blank Template *</div>
          <div id="status-blank" style="margin: 6px 0; font-size: 13px;"><em>No file</em></div>
          <input type="file" id="upload-blank" accept=".xlsx,.xls" class="vs-input" style="font-size: 12px;">
        </div>
        <div class="vs-card">
          <div class="vs-label">Reference Template</div>
          <div id="status-reference" style="margin: 6px 0; font-size: 13px;"><em>No file</em></div>
          <input type="file" id="upload-reference" accept=".xlsx,.xls" class="vs-input" style="font-size: 12px;">
        </div>
        <div class="vs-card">
          <div class="vs-label">Floor Plans</div>
          <div id="status-floorplan" style="margin: 6px 0; font-size: 13px;">0 file(s)</div>
          <input type="file" id="upload-floorplan" accept=".pdf,.png,.jpg,.jpeg" multiple class="vs-input" style="font-size: 12px;">
        </div>
      </div>
      <div id="upload-msg" style="margin-top: 12px;"></div>
      <div id="files-table-block"></div>
    </div>
  </div>

  <div class="vs-panel">
    <div class="vs-panel-header"><span>Sessions Using This Location</span></div>
    <div class="vs-panel-body" id="sessions-block" style="padding: 0;">
      <div style="padding: 18px; color: var(--vs-text-mute); font-size: 13px;">Loading…</div>
    </div>
  </div>
</main>

<!-- Edit location modal -->
<div id="modal-edit-loc" class="vs-modal-bg hidden">
  <div class="vs-modal">
    <div class="vs-modal-header">Edit Location</div>
    <div class="vs-modal-body">
      <div class="vs-form-row">
        <label class="vs-label">Name</label>
        <input type="text" class="vs-input" id="edit-name">
      </div>
      <div class="vs-form-row">
        <label class="vs-label">Description</label>
        <textarea class="vs-textarea" id="edit-desc" rows="3"></textarea>
      </div>
    </div>
    <div class="vs-modal-footer">
      <button class="vs-btn vs-btn-secondary" id="edit-cancel">Cancel</button>
      <button class="vs-btn vs-btn-danger" id="delete-loc" style="margin-right: auto;">Delete Location</button>
      <button class="vs-btn vs-btn-gold" id="edit-save">Save</button>
    </div>
  </div>
</div>

<script src="/profile.js"></script>
<script src="/location.js"></script>
</body>
</html>
