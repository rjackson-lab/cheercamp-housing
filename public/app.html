<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Cheer Camp Housing</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="vs-header">
  <div class="vs-brand">
    <span class="vs-brand-mark">UCA</span>
    <span class="vs-brand-sub">Camp Housing</span>
  </div>
  <div class="vs-user-bar">
    <span id="role-pill" class="vs-pill hidden">Admin</span>
    <span id="user-name"></span>
    <a href="#" id="logout" style="color:#fff; opacity:0.85;">Sign out</a>
  </div>
</header>

<!-- Tab nav (admin only) -->
<nav id="tab-nav" class="vs-tab-nav hidden">
  <div class="vs-tab-nav-inner">
    <button class="vs-tab active" data-tab="locations">Locations</button>
    <button class="vs-tab" data-tab="admin">Admin Tools <span id="admin-badge" class="vs-tab-badge hidden">0</span></button>
  </div>
</nav>

<main class="vs-page">

  <!-- ===== LOCATIONS TAB (always visible for everyone) ===== -->
  <section id="tab-locations">

    <div class="vs-flex-between vs-mb-lg">
      <div>
        <h1 style="margin:0; font-size:22px; color:var(--vs-navy);">Camp Locations</h1>
        <div class="vs-muted" id="locations-subtitle" style="font-size:13px; margin-top:4px;">Select a location to enter or edit a rooming list</div>
      </div>
      <button class="vs-btn vs-btn-gold" id="new-location-btn">+ New Location</button>
    </div>

    <!-- Stat cards summarizing status across locations -->
    <div class="vs-stat-grid" id="stats"></div>

    <!-- For admins: locations grouped by status (Completed / In Process / Errors-or-Not-Started) -->
    <!-- For users: simple grid -->
    <div id="location-content"></div>

  </section>

  <!-- ===== ADMIN TOOLS TAB (admin only) ===== -->
  <section id="tab-admin" class="hidden">

    <h1 style="margin:0 0 6px; font-size:22px; color:var(--vs-navy);">Admin Tools</h1>
    <div class="vs-muted vs-mb-lg" style="font-size:13px;">Approve users and manage access</div>

    <div class="vs-panel">
      <div class="vs-panel-header">
        <span>Pending Access Requests <span id="pending-count" class="vs-status pending" style="margin-left:8px;">0</span></span>
      </div>
      <div class="vs-panel-body" id="pending-body" style="padding:0;">
        <div style="padding:18px; color:var(--vs-text-mute); font-size:13px;">Loading…</div>
      </div>
    </div>

    <div class="vs-panel">
      <div class="vs-panel-header">
        <span>All Users</span>
      </div>
      <div class="vs-panel-body" id="users-body" style="padding:0;">
        <div style="padding:18px; color:var(--vs-text-mute); font-size:13px;">Loading…</div>
      </div>
    </div>

  </section>

</main>

<!-- New location modal -->
<div id="modal-new-location" class="vs-modal-bg hidden">
  <div class="vs-modal">
    <div class="vs-modal-header">New Location</div>
    <div class="vs-modal-body">
      <div class="vs-form-row">
        <label class="vs-label">Location Name</label>
        <input type="text" class="vs-input" id="new-loc-name" placeholder="e.g. UCF Session 1">
      </div>
      <div class="vs-form-row">
        <label class="vs-label">Description (optional)</label>
        <textarea class="vs-textarea" id="new-loc-desc" placeholder="Date range, notes, etc."></textarea>
      </div>
    </div>
    <div class="vs-modal-footer">
      <button class="vs-btn vs-btn-secondary" id="new-loc-cancel">Cancel</button>
      <button class="vs-btn" id="new-loc-create">Create</button>
    </div>
  </div>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
